name: Classic medical content consistency
on:
  pull_request:
  push:
    branches: [main, 'claude/sleepy-albattani-z4782h']
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-classic-content.mjs
