name: Studio regression tests
on:
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-tests.yml']
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/studio-tests.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk fonts-dejavu-core
      - run: python -m pip install pillow numpy
      - run: python -m unittest discover -s studio/tests -v
      - run: python -m unittest discover -s studio/mp4/tests -v
