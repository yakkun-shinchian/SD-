<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NurseTube｜YAKUBON STUDIO 看護の学び</title>
  <meta name="description" content="看護の「わからない」を、ひとつずつ。看護学生・新人看護師のための、イラスト・会話・スライドとシミュレーターで学ぶ教材サイト。" />
  <link rel="stylesheet" href="styles.css?v=20261001-views-countdown" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235cb96b'/><polygon points='40,32 40,68 70,50' fill='white'/></svg>" />
</head>
<body>
  <!-- ============ ヘッダー ============ -->
  <header class="topbar">
    <div class="topbar__left">
      <button id="menuToggle" class="icon-btn" aria-label="メニュー">
        <span class="hamburger"></span>
      </button>
      <a href="#/" class="logo" aria-label="ホームへ">
        <span class="logo__play">▶</span>
        <span class="logo__text">Nurse<strong>Tube</strong></span>
        <span class="logo__sub">by YAKUBON STUDIO</span>
      </a>
    </div>

    <form id="searchForm" class="search" role="search">
      <input id="searchInput" aria-label="教材を検索" class="search__input" type="search"
             placeholder="教材を探す（心電図、採血、糖尿病など）" autocomplete="off" />
      <button class="search__btn" type="submit" aria-label="検索">🔍</button>
    </form>

    <div class="topbar__right">
      <div id="examCountdown" class="countdown" title="看護師国家試験までの日数（data.js で変更できます）"></div>
      <button id="themeToggle" class="icon-btn" aria-label="テーマ切り替え">🌙</button>
    </div>
  </header>

  <section id="examHighlight" class="exam-highlight" aria-label="看護師国家試験までのカウントダウン" aria-live="polite"></section>

  <div class="layout">
    <!-- ============ サイドバー（カテゴリ） ============ -->
    <nav id="sidebar" class="sidebar" aria-label="カテゴリ">
      <ul id="categoryList" class="category-list"></ul>
      <div class="sidebar__foot">
        <p>見る・聴く・触ってわかる<br />看護の学びを、ひとつずつ。</p>
      </div>
    </nav>
    <div id="backdrop" class="backdrop" hidden></div>

    <!-- ============ メイン ============ -->
    <main id="main" class="main" tabindex="-1">
      <!-- ここに app.js が描画します -->
    </main>
  </div>

  <script src="data.js?v=20261001-views-countdown"></script>
  <script src="scenes.js?v=20261001-views-countdown"></script>
  <script src="figures.js"></script>
  <script src="audio/manifest.js"></script>
  <script src="images/manifest.js"></script>
  <script src="lessons.js?v=20261001-views-countdown"></script>
  <script src="legacy-views.js?v=20261001-views-countdown"></script>
  <script src="app.js?v=20261001-views-countdown"></script>
</body>
</html>
